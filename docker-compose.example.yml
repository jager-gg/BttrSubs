# BttrSubs, self-hosted. Copy this to docker-compose.yml and .env.example to .env, fill in .env,
# then: docker compose up -d
services:
  bttr-subs:
    # The published image. `:1` follows every 1.x release, but never a major version that could need a
    # step when upgrading; `:latest` follows everything, and `:1.0.0` stays put.
    image: ghcr.io/jager-gg/bttrsubs:1
    # Building from source instead: comment out `image`, uncomment `build`, then
    # `docker compose up -d --build` (the tests run during the build).
    # build: .
    container_name: bttr-subs
    restart: unless-stopped
    env_file:
      - .env
    # Reach it at http://<this machine>:7000. Behind a reverse proxy on the same Docker network,
    # drop `ports` and join the proxy's network instead (see `networks` below).
    ports:
      - "7000:7000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      # Cache and edited links. Back it up with CONFIG_SECRET: links edited on their configure page live here.
      - bttr-subs-cache:/app/cache
      # Subtitles of your own, listed and synced like any source's (README, "Subtitles kept on your
      # server"): one folder a title by IMDb id, one file an episode. Nothing else holds these files.
      # - ./captions:/app/captions:ro
#   To reach your own AIOStreams by container name (AIOSTREAMS_BASE=http://aiostreams:3000),
#   put both on one network:
#   networks:
#     - aiostreams
#
# networks:
#   aiostreams:
#     external: true   # the network your AIOStreams container is on

volumes:
  bttr-subs-cache:
